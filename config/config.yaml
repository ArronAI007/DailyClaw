app:
  version_check_url: ''
  show_version_update: true
crawler:
  request_interval: 1000
  max_workers: 5
  enable_crawler: true
  use_proxy: false
  default_proxy: http://127.0.0.1:10086
report:
  mode: daily
  rank_threshold: 5
  sort_by_position_first: false
  max_news_per_keyword: 0
  cards_per_batch: 12
  reverse_content_order: false
notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  max_accounts_per_channel: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"
  push_window:
    enabled: false
    time_range:
      start: '20:00'
      end: '22:00'
    once_per_day: true
  webhooks:
    feishu_url: ''
    dingtalk_url: ''
    wework_url: ''
    wework_msg_type: markdown
    telegram_bot_token: ''
    telegram_chat_id: ''
    email_from: ''
    email_password: ''
    email_to: ''
    email_smtp_server: ''
    email_smtp_port: ''
    ntfy_server_url: https://ntfy.sh
    ntfy_topic: ''
    ntfy_token: ''
    bark_url: ''
    slack_webhook_url: ''
weight:
  rank_weight: 0.6
  frequency_weight: 0.3
  hotness_weight: 0.1
# ===============================================================
# AI 智能分类（新闻分类浏览功能）
# ===============================================================
filter:
  method: "keyword"          # keyword（现状，关键词过滤） | ai（AI 智能分类）

ai:
  # LiteLLM 模型格式: 提供商/模型名，完整列表见 https://docs.litellm.ai/docs/providers
  model: "deepseek/deepseek-v4-flash"
  api_key: ""                # 建议用环境变量 AI_API_KEY，不要写进这个文件
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []

ai_filter:
  batch_size: 200             # 每批发送给 AI 的标题数
  batch_interval: 2           # 分批间隔（秒），避免触发 API 限流
  min_score: 0.7              # 展示最低相关度分数阈值（0.0~1.0）
  reclassify_threshold: 0.6   # 兴趣描述变更时，change_ratio 超过此值触发全量重分类
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"
