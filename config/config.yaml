app:
  version_check_url: ''
  show_version_update: true
crawler:
  request_interval: 1000
  max_workers: 5
  enable_crawler: true
  use_proxy: false
  default_proxy: http://127.0.0.1:10086
report:
  mode: daily
  rank_threshold: 5
  sort_by_position_first: false
  max_news_per_keyword: 0
  reverse_content_order: false
notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  max_accounts_per_channel: 3
  push_window:
    enabled: false
    time_range:
      start: '20:00'
      end: '22:00'
    once_per_day: true
  webhooks:
    feishu_url: ''
    dingtalk_url: ''
    wework_url: ''
    wework_msg_type: markdown
    telegram_bot_token: ''
    telegram_chat_id: ''
    email_from: ''
    email_password: ''
    email_to: ''
    email_smtp_server: ''
    email_smtp_port: ''
    ntfy_server_url: https://ntfy.sh
    ntfy_topic: ''
    ntfy_token: ''
    bark_url: ''
    slack_webhook_url: ''
weight:
  rank_weight: 0.6
  frequency_weight: 0.3
  hotness_weight: 0.1
